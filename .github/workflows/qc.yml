name: QC

on:
  pull_request:
    paths:
      - "src/ontology/**"
  push:
    branches: [main]
    paths:
      - "src/ontology/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ROBOT
        run: |
          sudo apt-get update && sudo apt-get install -y default-jre
          curl -L -o /usr/local/bin/robot.jar https://github.com/ontodev/robot/releases/latest/download/robot.jar
          curl -L -o /usr/local/bin/robot https://raw.githubusercontent.com/ontodev/robot/master/bin/robot
          chmod +x /usr/local/bin/robot

      - name: Syntax check
        working-directory: src/ontology
        run: robot convert -vvv -i pizza-edit.owl -o /tmp/pizza-syntax.owl

      - name: Reason (catches unsatisfiable classes)
        working-directory: src/ontology
        run: robot reason -i pizza-edit.owl -r ELK -o /tmp/pizza-reasoned.owl

      - name: Check for duplicate temporary IDs
        working-directory: src/ontology
        run: |
          dupes=$(grep '<owl:Class rdf:about="http://example.org/pizza/PIZZA_099' pizza-edit.owl \
            | sed -E 's/.*(PIZZA_099[0-9]+).*/\1/' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate temporary IDs found:"
            echo "$dupes"
            exit 1
          fi

      - name: No hand-edits under imports/
        run: |
          # Fails if a PR modifies generated import files without also touching
          # the corresponding iri_dependencies list — a common agent mistake to catch in CI.
          if git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep -q '^src/ontology/imports/' ; then
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep -q '^src/ontology/iri_dependencies/' ; then
              echo "imports/ changed without a corresponding iri_dependencies/ change — imports/ should only ever be regenerated by 'make', never hand-edited."
              exit 1
            fi
          fi
