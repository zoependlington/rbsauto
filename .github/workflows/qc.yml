# Basic ODK workflow

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  ontology_qc:
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:latest

    steps:
      - uses: actions/checkout@v6

      - name: Ensure odk-helper is available
        run: pip install --break-system-packages odk-core

      - name: Run ontology QC checks
        env:
          DEFAULT_BRANCH: main
        run: cd src/ontology && make ROBOT_ENV='ROBOT_JAVA_ARGS=-Xmx6G' test IMP=false PAT=false MIR=false
