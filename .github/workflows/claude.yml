name: Claude Code Agent

# Mirrors the trigger set EBISPOT/efo uses: comment mentions, issue assignment,
# and a label, so a maintainer has three equivalent ways to hand off a ticket.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  claude-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ROBOT is required by every subagent (make normalize_src / robot reason).
      - name: Install ROBOT
        run: |
          sudo apt-get update && sudo apt-get install -y default-jre
          curl -L -o /usr/local/bin/robot.jar https://github.com/ontodev/robot/releases/latest/download/robot.jar
          curl -L -o /usr/local/bin/robot https://raw.githubusercontent.com/ontodev/robot/master/bin/robot
          chmod +x /usr/local/bin/robot

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            Follow CLAUDE.md and handle the issue end to end. This action runs
            in a single Claude session and may not provide separate specialist
            subagents. If specialist dispatch is unavailable, perform the
            curator, importer, and ontologist responsibilities yourself in
            sequence: research and define the requested concept, verify or
            import external FoodOn terms, edit the ontology, run the required
            normalization and ROBOT validation, then create the issue branch,
            commit, push, and open the pull request. Do not stop after giving
            advice or a partial analysis.

            Always post a comment on the triggering issue yourself, using the
            gh CLI (e.g. gh issue comment <number> --body "..."). Do not rely
            on any comment the action posts automatically. Post one comment
            near the start acknowledging you're working on it, and one at the
            end summarizing what you did and linking the PR you opened (or
            explaining clearly why you could not complete the task).

          assignee_trigger: "claude"
          label_trigger: "claude"
          trigger_phrase: "@claude"

          claude_args: |
            --max-turns 50
            --allowedTools Edit,Read,Write,Bash,Grep,Glob,WebSearch,WebFetch
